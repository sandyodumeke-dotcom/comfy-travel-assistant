
name: Build Comfy Travel Assistant APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download project
      - name: Check out project
        uses: actions/checkout@v4

      # 2. Verify project files
      - name: Check project files
        run: |
          set -e

          files="
          settings.gradle
          build.gradle
          gradle.properties
          gradle/wrapper/gradle-wrapper.properties
          app/build.gradle
          app/src/main/AndroidManifest.xml
          app/src/main/assets/index.html
          "

          for f in $files; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing project file: $f"
              exit 1
            fi
          done

          echo "All required project files found."

      # 3. Install Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Install Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 5. Accept Android SDK licenses
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          set -o pipefail

          yes | sdkmanager --licenses

          echo "Android SDK licenses accepted."

      # 6. Install required Android packages
      - name: Install Android SDK packages
        run: |
          set -e

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."

      # 7. Install Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # 8. Prepare Gradle wrapper
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then

            echo "Generating Gradle wrapper..."

            mkdir -p /tmp/wrapgen
            cd /tmp/wrapgen

            touch settings.gradle

            gradle wrapper --gradle-version 8.11.1

            cd "$GITHUB_WORKSPACE"

            mkdir -p gradle/wrapper

            cp /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar \
              gradle/wrapper/gradle-wrapper.jar

            cp /tmp/wrapgen/gradlew ./gradlew
            cp /tmp/wrapgen/gradlew.bat ./gradlew.bat
          fi

          chmod +x gradlew

          ./gradlew --version

      # 9. Build Android APK
      - name: Build Comfy Travel Assistant APK
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon

      # 10. Verify generated APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::No APK was generated."
            exit 1
          fi

          mkdir -p dist

          cp "$APK" dist/Comfy-Travel-Assistant.apk

          AAPT=$(find "$ANDROID_HOME/build-tools" \
            -name aapt | sort -V | tail -n 1)

          if [ -z "$AAPT" ]; then
            echo "::error::Android aapt tool not found."
            exit 1
          fi

          echo "APK information:"
          "$AAPT" dump badging dist/Comfy-Travel-Assistant.apk

          MIN=$("$AAPT" dump badging \
            dist/Comfy-Travel-Assistant.apk \
            | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")

          echo "Minimum Android API: $MIN"

          if [ -z "$MIN" ] || [ "$MIN" -gt 26 ]; then
            echo "::error::APK must support Android 8.0 (API 26) or lower."
            exit 1
          fi

          echo "APK verification successful."

      # 11. Upload APK
      - name: Upload Comfy Travel Assistant APK
        uses: actions/upload-artifact@v4
        with:
          name: Comfy-Travel-Assistant-APK
          path: dist/Comfy-Travel-Assistant.apk
          if-no-files-found: error
          retention-days: 30

      # 12. Upload error reports if build fails
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Comfy-Travel-Assistant-Build-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
