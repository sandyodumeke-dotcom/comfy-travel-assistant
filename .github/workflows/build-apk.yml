name: Build Comfy Travel Assistant APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the project
        uses: actions/checkout@v4

      - name: Check the project files are in the right place
        run: |
          missing=0
          for f in settings.gradle build.gradle gradle.properties gradle/wrapper/gradle-wrapper.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/assets/index.html; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f. Upload the CONTENTS of the project folder to the top level of the repository."
              missing=1
            fi
          done
          exit $missing

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept Andriod licence SDK Lincences
        run: yes | sdkmanager --licences

      - name: Pre-install Android SDK packages
        continue-on-error: true
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Prepare the Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "gradle-wrapper.jar is not in the project, creating it with the official Gradle command"
            mkdir -p /tmp/wrapgen
            cd /tmp/wrapgen
            touch settings.gradle
            gradle wrapper --gradle-version 8.11.1
            cd "$GITHUB_WORKSPACE"
            mkdir -p gradle/wrapper
            cp /tmp/wrapgen/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
            cp /tmp/wrapgen/gradlew /tmp/wrapgen/gradlew.bat .
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build the APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Check the APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::No APK was produced"; exit 1; fi
          mkdir -p dist
          cp "$APK" dist/Comfy-Travel-Assistant.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT" dump badging dist/Comfy-Travel-Assistant.apk | grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label:" || true
          MIN=$("$AAPT" dump badging dist/Comfy-Travel-Assistant.apk | sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p")
          echo "Minimum Android version (API level): $MIN"
          if [ -z "$MIN" ] || [ "$MIN" -gt 26 ]; then echo "::error::The APK does not support Android 8.0 (API 26)"; exit 1; fi

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Comfy-Travel-Assistant-APK
          path: dist/Comfy-Travel-Assistant.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports
          if-no-files-found: ignore
